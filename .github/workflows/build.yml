name: Build
on: [push, workflow_dispatch]
jobs:
 b:
  runs-on: ubuntu-latest
  steps:
  - uses: actions/setup-java@v4
    with: { distribution: temurin, java-version: 17 }
  - uses: gradle/actions/setup-gradle@v3
    with: { gradle-version: 8.7 }
  - run: |
     mkdir -p $(dirname app/build.gradle)
     cat > app/build.gradle <<'EOF_FILE'
     plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
     android {
         namespace 'com.island.app'
         compileSdk 34
         defaultConfig { applicationId 'com.island.app'; minSdk 29; targetSdk 33; versionCode 1; versionName '1.0' }
         buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
         compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
         kotlinOptions { jvmTarget = '17' }
         lint { abortOnError false; checkReleaseBuilds false }
     }
     dependencies { implementation 'androidx.core:core-ktx:1.13.1' }
     EOF_FILE
     mkdir -p $(dirname app/src/main/AndroidManifest.xml)
     cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
     <?xml version="1.0" encoding="utf-8"?>
     <manifest xmlns:android="http://schemas.android.com/apk/res/android">
         <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
         <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
         <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
         <uses-permission android:name="android.permission.READ_PHONE_STATE"/>
         <uses-permission android:name="android.permission.ANSWER_PHONE_CALLS"/>
         <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
         <uses-permission android:name="android.permission.VIBRATE"/>
         <application android:label="Dynamic Island" android:icon="@drawable/ic_launcher" android:theme="@style/AppTheme">
             <activity android:name=".SettingsActivity" android:exported="true" android:theme="@style/SettingsTheme">
                 <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
             </activity>
             <service android:name=".IslandService" android:exported="false" android:foregroundServiceType="specialUse">
                 <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="overlay"/>
             </service>
             <service android:name=".IslandNotifListener" android:exported="true"
                 android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                 <intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter>
             </service>
             <receiver android:name=".BootReceiver" android:exported="true">
                 <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter>
             </receiver>
         </application>
     </manifest>
     EOF_FILE
     mkdir -p $(dirname app/src/main/java/com/island/app/BootReceiver.kt)
     cat > app/src/main/java/com/island/app/BootReceiver.kt <<'EOF_FILE'
     package com.island.app
     import android.content.*
     class BootReceiver : BroadcastReceiver() {
         override fun onReceive(c: Context, i: Intent) { c.startForegroundService(Intent(c, IslandService::class.java)) }
     }
     EOF_FILE
     mkdir -p $(dirname app/src/main/java/com/island/app/IslandNotifListener.kt)
     cat > app/src/main/java/com/island/app/IslandNotifListener.kt <<'EOF_FILE'
     package com.island.app
     import android.app.Notification
     import android.content.ComponentName
     import android.media.session.MediaController
     import android.media.session.MediaSessionManager
     import android.service.notification.NotificationListenerService
     import android.service.notification.StatusBarNotification

     class IslandNotifListener : NotificationListenerService() {
         override fun onListenerConnected() { refresh() }
         override fun onNotificationPosted(sbn: StatusBarNotification) = refresh()
         override fun onNotificationRemoved(sbn: StatusBarNotification) = refresh()

         private fun refresh() {
             val nots = try { activeNotifications } catch (e: Exception) { return }
             val call = nots.firstOrNull { it.notification.category == Notification.CATEGORY_CALL && (it.notification.actions?.size ?: 0) >= 1 }
             IslandBus.call = call?.let {
                 val acts = it.notification.actions
                 val ans = acts.firstOrNull { a -> a.title.toString().matches(Regex("(?i).*(answer|accept|ответ|принять).*")) } ?: acts.first()
                 val dec = acts.firstOrNull { a -> a.title.toString().matches(Regex("(?i).*(decline|reject|hang|отклон|сброс).*")) } ?: acts.last()
                 CallInfo(it.notification.extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: "Входящий вызов", ans, dec)
             }
             IslandBus.recording = nots.any { it.packageName == "com.android.systemui" &&
                 (it.notification.channelId?.contains("screen", true) == true) }
             try {
                 val msm = getSystemService(MediaSessionManager::class.java)
                 IslandBus.media = msm.getActiveSessions(ComponentName(this, IslandNotifListener::class.java)).firstOrNull()
             } catch (_: SecurityException) {}
             IslandBus.notifyChanged()
         }
     }
     data class CallInfo(val name: String, val answer: Notification.Action, val decline: Notification.Action)
     object IslandBus {
         @Volatile var call: CallInfo? = null
         @Volatile var recording = false
         @Volatile var media: MediaController? = null
         var onChange: (() -> Unit)? = null
         fun notifyChanged() { onChange?.invoke() }
     }
     EOF_FILE
     mkdir -p $(dirname app/src/main/java/com/island/app/IslandService.kt)
     cat > app/src/main/java/com/island/app/IslandService.kt <<'EOF_FILE'
     package com.island.app

     import android.animation.ValueAnimator
     import android.app.*
     import android.content.Intent
     import android.graphics.*
     import android.graphics.drawable.Drawable
     import android.graphics.drawable.GradientDrawable
     import android.graphics.drawable.LayerDrawable
     import android.hardware.camera2.CameraManager
     import android.media.MediaMetadata
     import android.media.session.PlaybackState
     import android.os.*
     import android.view.*
     import android.view.animation.OvershootInterpolator
     import android.view.animation.PathInterpolator
     import android.widget.*

     class IslandService : Service() {
         private lateinit var wm: WindowManager
         private lateinit var prefs: Prefs
         private lateinit var root: FrameLayout
         private lateinit var lp: WindowManager.LayoutParams
         private lateinit var left: ImageView
         private lateinit var title: TextView
         private lateinit var content: LinearLayout
         private val h = Handler(Looper.getMainLooper())
         private var torchOn = false
         private var expanded = false
         private var state = "idle"
         private var forced: String? = null
         private val ease = PathInterpolator(0.2f, 0.9f, 0.2f, 1f)
         private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
         private fun corner() = minOf(lp.height / 2f, dp(prefs.radius).toFloat())

         override fun onBind(i: Intent?): IBinder? = null

         override fun onCreate() {
             super.onCreate()
             prefs = Prefs(this)
             wm = getSystemService(WINDOW_SERVICE) as WindowManager
             getSystemService(NotificationManager::class.java)
                 .createNotificationChannel(NotificationChannel("island", "Dynamic Island", NotificationManager.IMPORTANCE_MIN))
             startForeground(1, Notification.Builder(this, "island").setSmallIcon(R.drawable.ic_launcher).setContentTitle("Dynamic Island").build())
             build()
             getSystemService(CameraManager::class.java).registerTorchCallback(object : CameraManager.TorchCallback() {
                 override fun onTorchModeChanged(id: String, on: Boolean) { torchOn = on; h.post { update() } }
             }, h)
             IslandBus.onChange = { h.post { update() } }
             h.post(object : Runnable { override fun run() { if (state == "media" && expanded) updateProgress(); h.postDelayed(this, 1000) } })
         }

         private fun build() {
             lp = WindowManager.LayoutParams(dp(prefs.width), dp(prefs.height),
                 WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                 WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                     WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                 PixelFormat.TRANSLUCENT).apply {
                 gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
                 x = dp(prefs.offsetX - 100); y = dp(prefs.topMargin)
             }
             root = FrameLayout(this).apply {
                 background = GradientDrawable().apply { setColor(Color.BLACK); cornerRadius = dp(prefs.height) / 2f }
                 clipToOutline = true; visibility = View.GONE; alpha = 0f
             }
             val gd = GestureDetector(this, object : GestureDetector.SimpleOnGestureListener() {
                 override fun onDown(e: MotionEvent): Boolean = true
                 override fun onSingleTapUp(e: MotionEvent): Boolean { toggle(); return true }
                 override fun onFling(e1: MotionEvent?, e2: MotionEvent, vx: Float, vy: Float): Boolean {
                     if (Math.abs(vx) > Math.abs(vy)) { swipe(if (vx < 0) 1 else -1); return true }
                     return false
                 }
             })
             root.setOnTouchListener { _, ev -> gd.onTouchEvent(ev) }
             left = ImageView(this); title = TextView(this); content = LinearLayout(this)
             wm.addView(root, lp)
         }

         private fun destroyViews() {
             try { wm.removeView(root) } catch (_: Exception) {}
         }

         private var sel = 0
         private fun activeList(): List<String> {
             forced?.let { return listOf(it) }
             val l = ArrayList<String>()
             if (prefs.showCalls && IslandBus.call != null) l.add("call")
             if (prefs.showRec && IslandBus.recording) l.add("rec")
             val md = if (prefs.showMedia) IslandBus.media else null
             if (md != null && md.playbackState?.state == PlaybackState.STATE_PLAYING) l.add("media")
             if (prefs.showTorch && torchOn) l.add("torch")
             return l
         }

         private fun update() {
             val l = activeList()
             if (sel >= l.size) sel = 0
             val next = if (l.isEmpty()) "idle" else if (l.contains("call")) "call" else l[sel]
             if (next != state) { state = next; expanded = next == "call"; render() }
         }

         // Свайп влево/вправо переключает активности, как в One UI 9.5
         private fun swipe(dir: Int) {
             val l = activeList()
             if (l.size < 2 || state == "call") return
             sel = (sel + dir + l.size) % l.size
             update()
         }

         private fun render() {
             if (state == "idle") { hide(); return }
             show()
             root.removeAllViews()
             val hh = dp(prefs.height); val pad = dp(3); val d = hh - 2 * pad
             val lw = if (state == "media") (d * 1.55f).toInt() else d
             left = ImageView(this).apply {
                 scaleType = ImageView.ScaleType.CENTER_CROP; clipToOutline = true
                 background = GradientDrawable().apply { cornerRadius = if (state == "media") d * 0.42f else d / 2f; setColor(Color.DKGRAY) }
                 layoutParams = FrameLayout.LayoutParams(lw, d, Gravity.TOP or Gravity.START).apply { setMargins(pad, pad, 0, 0) }
             }
             title = TextView(this).apply {
                 setTextColor(Color.WHITE); textSize = prefs.textSize.toFloat(); typeface = Typeface.DEFAULT_BOLD; maxLines = 1
                 ellipsize = android.text.TextUtils.TruncateAt.END; gravity = Gravity.CENTER_VERTICAL or Gravity.END
                 layoutParams = FrameLayout.LayoutParams(-2, hh, Gravity.TOP or Gravity.END).apply { marginEnd = dp(14) }
             }
             content = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; visibility = View.GONE; setPadding(dp(18), hh + dp(8), dp(18), dp(14)) }
             var w = prefs.width; var stroke = 0
             when (state) {
                 "rec" -> { left.setImageDrawable(ringIcon()); title.text = "" }
                 "torch" -> { left.setImageDrawable(torchIcon()); title.text = "Torch"; w += 20 }
                 "media" -> {
                     val meta = IslandBus.media?.metadata
                     left.setImageBitmap(meta?.getBitmap(MediaMetadata.METADATA_KEY_ALBUM_ART) ?: meta?.getBitmap(MediaMetadata.METADATA_KEY_ART))
                     title.text = meta?.getString(MediaMetadata.METADATA_KEY_TITLE) ?: "Media"
                     title.maxWidth = dp(prefs.mediaWidth) - lw - dp(24)
                     w = prefs.mediaWidth; stroke = Color.parseColor("#E91E63")
                 }
                 "call" -> { left.setImageDrawable(oval("#34C759")); title.text = IslandBus.call?.name ?: "Входящий вызов"; w = prefs.mediaWidth }
             }
             (root.background as GradientDrawable).setStroke(if (stroke == 0) 0 else dp(2), stroke)
             root.addView(left); root.addView(title); root.addView(content)
             if (expanded) {
                 title.layoutParams = FrameLayout.LayoutParams(-2, hh, Gravity.TOP or Gravity.START).apply { marginStart = hh + dp(8) }
                 title.gravity = Gravity.CENTER_VERTICAL or Gravity.START
                 content.visibility = View.VISIBLE
                 fillContent()
             }
             val tw = if (expanded) resources.displayMetrics.widthPixels - dp(24) else dp(w)
             val th = if (expanded) (if (state == "call") hh + dp(prefs.btnHeight + 24) else dp(prefs.cardHeight)) else hh
             animateTo(tw, th)
         }

         private fun fillContent() {
             if (state == "call") {
                 val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER }
                 row.addView(pill(prefs.decLabel, "#FF3B30") { IslandBus.call?.decline?.actionIntent?.send(); finishCall() })
                 row.addView(View(this), LinearLayout.LayoutParams(dp(16), 1))
                 row.addView(pill(prefs.ansLabel, "#34C759") { IslandBus.call?.answer?.actionIntent?.send(); finishCall() })
                 content.addView(row, LinearLayout.LayoutParams(-1, dp(prefs.btnHeight)))
             } else if (state == "media") {
                 val md = IslandBus.media
                 if (prefs.showArtist) content.addView(TextView(this).apply { setTextColor(Color.LTGRAY); textSize = 12f; text = md?.metadata?.getString(MediaMetadata.METADATA_KEY_ARTIST) ?: "" })
                 if (prefs.showProgress) content.addView(ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply { tag = "bar"; max = 1000 }, LinearLayout.LayoutParams(-1, dp(10)))
                 if (prefs.showControls) {
                     val ctl = LinearLayout(this).apply { gravity = Gravity.CENTER }
                     fun b(s: String, f: () -> Unit) = TextView(this).apply { text = s; textSize = 26f; setTextColor(Color.WHITE); setPadding(dp(22), 0, dp(22), 0); setOnClickListener { f() } }
                     ctl.addView(b("⏮") { IslandBus.media?.transportControls?.skipToPrevious() })
                     ctl.addView(b("⏯") { val m = IslandBus.media; if (m?.playbackState?.state == PlaybackState.STATE_PLAYING) m.transportControls.pause() else m?.transportControls?.play() })
                     ctl.addView(b("⏭") { IslandBus.media?.transportControls?.skipToNext() })
                     content.addView(ctl)
                 }
             }
         }

         private fun finishCall() { forced = null; expanded = false; state = "idle"; h.postDelayed({ update() }, 250) }

         private fun updateProgress() {
             val m = IslandBus.media ?: return
             val dur = m.metadata?.getLong(MediaMetadata.METADATA_KEY_DURATION) ?: 0
             val pos = m.playbackState?.position ?: 0
             content.findViewWithTag<ProgressBar>("bar")?.progress = if (dur > 0) (pos * 1000 / dur).toInt() else 0
         }

         private fun pill(t: String, color: String, f: () -> Unit) = TextView(this).apply {
             text = t; setTextColor(Color.WHITE); textSize = 16f; typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER
             background = GradientDrawable().apply { setColor(Color.parseColor(color)); cornerRadius = dp(prefs.btnHeight) / 2f }
             layoutParams = LinearLayout.LayoutParams(0, -1, 1f); setOnClickListener { f() }
         }
         private fun ringIcon(): Drawable {
             val r = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(Color.TRANSPARENT); setStroke(dp(2), Color.WHITE) }
             return LayerDrawable(arrayOf(oval("#E53935"), r)).apply { val i = dp(7); setLayerInset(1, i, i, i, i) }
         }
         private fun torchIcon(): Drawable {
             val r = GradientDrawable().apply { setColor(Color.WHITE); cornerRadius = dp(2).toFloat() }
             return LayerDrawable(arrayOf(oval("#2F6BFF"), r)).apply { setLayerInset(1, dp(11), dp(8), dp(11), dp(8)) }
         }
         private fun oval(c: String) = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(Color.parseColor(c)) }

         private fun toggle() { if (state != "media") return; expanded = !expanded; render() }

         private fun animateTo(w: Int, hg: Int) {
             val ow = lp.width; val oh = lp.height
             ValueAnimator.ofFloat(0f, 1f).apply {
                 duration = prefs.animMs.toLong(); interpolator = if (expanded) OvershootInterpolator(1.1f) else ease
                 addUpdateListener { a ->
                     val f = a.animatedValue as Float
                     lp.width = (ow + (w - ow) * f).toInt(); lp.height = (oh + (hg - oh) * f).toInt()
                     (root.background as GradientDrawable).cornerRadius = corner()
                     try { wm.updateViewLayout(root, lp) } catch (_: Exception) {}
                 }
                 start()
             }
         }
         private fun show() {
             if (root.visibility != View.VISIBLE) {
                 root.visibility = View.VISIBLE; root.scaleX = .6f; root.scaleY = .6f
                 root.animate().alpha(1f).scaleX(1f).scaleY(1f).setDuration(prefs.animMs.toLong()).setInterpolator(OvershootInterpolator(1.4f)).start()
             }
         }
         private fun hide() {
             root.animate().alpha(0f).scaleX(.6f).scaleY(.6f).setDuration(220).withEndAction {
                 root.visibility = View.GONE; lp.width = dp(prefs.width); lp.height = dp(prefs.height)
                 try { wm.updateViewLayout(root, lp) } catch (_: Exception) {}
             }.start()
         }

         override fun onStartCommand(i: Intent?, f: Int, s: Int): Int {
             when (i?.action) {
                 "reload" -> { destroyViews(); build(); state = "x"; update() }
                 "test" -> { val t = i.getStringExtra("s"); forced = if (t == "off") null else t; state = "x"; update() }
             }
             return START_STICKY
         }
         override fun onDestroy() {
             destroyViews(); super.onDestroy()
         }
     }
     EOF_FILE
     mkdir -p $(dirname app/src/main/java/com/island/app/Prefs.kt)
     cat > app/src/main/java/com/island/app/Prefs.kt <<'EOF_FILE'
     package com.island.app
     import android.content.Context
     class Prefs(c: Context) {
         private val p = c.getSharedPreferences("island", Context.MODE_PRIVATE)
         private fun i(k: String, d: Int) = p.getInt(k, d)
         private fun s(k: String, v: Int) = p.edit().putInt(k, v).apply()
         private fun b(k: String, d: Boolean) = p.getBoolean(k, d)
         private fun sb(k: String, v: Boolean) = p.edit().putBoolean(k, v).apply()
         var topMargin: Int get() = i("top", 7); set(v) = s("top", v)
         var offsetX: Int get() = i("ox", 100); set(v) = s("ox", v)
         var height: Int get() = i("h", 34); set(v) = s("h", v)
         var width: Int get() = i("w", 108); set(v) = s("w", v)
         var mediaWidth: Int get() = i("mw", 152); set(v) = s("mw", v)
         var cardHeight: Int get() = i("ch", 130); set(v) = s("ch", v)
         var radius: Int get() = i("rad", 24); set(v) = s("rad", v)
         var textSize: Int get() = i("ts", 15); set(v) = s("ts", v)
         var btnHeight: Int get() = i("bh", 46); set(v) = s("bh", v)
         var animMs: Int get() = i("anim", 380); set(v) = s("anim", v)
         var showMedia: Boolean get() = b("media", true); set(v) = sb("media", v)
         var showCalls: Boolean get() = b("calls", true); set(v) = sb("calls", v)
         var showTorch: Boolean get() = b("torch", true); set(v) = sb("torch", v)
         var showRec: Boolean get() = b("rec", true); set(v) = sb("rec", v)
         var showArtist: Boolean get() = b("artist", true); set(v) = sb("artist", v)
         var showProgress: Boolean get() = b("prog", true); set(v) = sb("prog", v)
         var showControls: Boolean get() = b("ctl", true); set(v) = sb("ctl", v)
         var blurApp: Boolean get() = b("blur", true); set(v) = sb("blur", v)
         var ansLabel: String get() = p.getString("ans", "Ответить") ?: "Ответить"; set(v) = p.edit().putString("ans", v).apply()
         var decLabel: String get() = p.getString("dec", "Отклонить") ?: "Отклонить"; set(v) = p.edit().putString("dec", v).apply()
         /** Размеры и положение, измеренные по видео (dp). */
         fun videoPreset() { topMargin = 7; offsetX = 100; height = 34; width = 108; mediaWidth = 152; radius = 24; textSize = 15; animMs = 380 }
     }
     EOF_FILE
     mkdir -p $(dirname app/src/main/java/com/island/app/SettingsActivity.kt)
     cat > app/src/main/java/com/island/app/SettingsActivity.kt <<'EOF_FILE'
     package com.island.app

     import android.app.Activity
     import android.content.Intent
     import android.content.res.ColorStateList
     import android.graphics.Color
     import android.graphics.Typeface
     import android.graphics.drawable.ColorDrawable
     import android.graphics.drawable.GradientDrawable
     import android.net.Uri
     import android.os.Build
     import android.os.Bundle
     import android.provider.Settings
     import android.text.Editable
     import android.text.TextWatcher
     import android.view.Gravity
     import android.view.View
     import android.view.WindowManager
     import android.widget.*

     class SettingsActivity : Activity() {
         private lateinit var p: Prefs
         private val accent = Color.parseColor("#0381FE")
         private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

         override fun onCreate(s: Bundle?) {
             super.onCreate(s); p = Prefs(this)
             var blur = false
             if (Build.VERSION.SDK_INT >= 31 && p.blurApp) blur = getSystemService(WindowManager::class.java).isCrossWindowBlurEnabled
             if (blur && Build.VERSION.SDK_INT >= 31) {
                 window.setBackgroundDrawable(ColorDrawable(Color.parseColor("#8CEEF2FB")))
                 window.setBackgroundBlurRadius(120)
             } else window.setBackgroundDrawable(ColorDrawable(Color.parseColor("#F2F4FA")))

             val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(16), dp(84), dp(16), dp(40)) }
             col.addView(TextView(this).apply { text = "Dynamic Island"; textSize = 34f; typeface = Typeface.DEFAULT_BOLD; setTextColor(Color.parseColor("#111111")); setPadding(dp(8), 0, 0, dp(2)) })
             col.addView(TextView(this).apply { text = "Настройки острова и панели"; textSize = 15f; setTextColor(Color.parseColor("#6B7280")); setPadding(dp(8), 0, 0, dp(8)) })

             col.addView(label("РАЗРЕШЕНИЯ"))
             col.addView(card(
                 pillBtn("1. Показ поверх других окон") { startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))) },
                 pillBtn("2. Доступ к уведомлениям") { startActivity(Intent("android.settings.ACTION_NOTIFICATION_LISTENER_SETTINGS")) },
                 pillBtn("Запустить остров") { startForegroundService(Intent(this, IslandService::class.java)) },
                 pillBtn("Размеры как в видео") { p.videoPreset(); recreate(); reload() }))

             col.addView(label("ТЕСТ (без реального звонка и плеера)"))
             col.addView(card(
                 testRow("Звонок" to "call", "Плеер" to "media"),
                 testRow("Фонарик" to "torch", "Запись" to "rec"),
                 pillBtn("Выключить тест") { test("off") }))

             col.addView(label("ЧТО ПОКАЗЫВАТЬ"))
             col.addView(card(
                 sw("Медиаплеер", { p.showMedia }) { p.showMedia = it },
                 sw("Звонки (Ответить / Отклонить)", { p.showCalls }) { p.showCalls = it },
                 sw("Фонарик", { p.showTorch }) { p.showTorch = it },
                 sw("Запись экрана", { p.showRec }) { p.showRec = it }))

             col.addView(label("КАРТОЧКА ПЛЕЕРА"))
             col.addView(card(
                 sw("Исполнитель", { p.showArtist }) { p.showArtist = it },
                 sw("Полоса прогресса", { p.showProgress }) { p.showProgress = it },
                 sw("Кнопки управления", { p.showControls }) { p.showControls = it }))

             col.addView(label("КНОПКИ ЗВОНКА"))
             col.addView(card(
                 field("Текст кнопки ответа", { p.ansLabel }) { p.ansLabel = it },
                 field("Текст кнопки отклонения", { p.decLabel }) { p.decLabel = it },
                 seek("Высота кнопок", 80, { p.btnHeight }, { p.btnHeight = it })))

             col.addView(label("РАЗМЕРЫ И ПОЛОЖЕНИЕ (dp)"))
             col.addView(card(
                 seek("Позиция X (0 = центр)", 200, { p.offsetX }, { p.offsetX = it }, 100),
                 seek("Позиция Y (отступ сверху)", 60, { p.topMargin }, { p.topMargin = it }),
                 seek("Высота", 70, { p.height }, { p.height = it }),
                 seek("Ширина (свёрнутый)", 250, { p.width }, { p.width = it }),
                 seek("Ширина (медиа / звонок)", 300, { p.mediaWidth }, { p.mediaWidth = it }),
                 seek("Высота карточки плеера", 260, { p.cardHeight }, { p.cardHeight = it }),
                 seek("Скругление", 40, { p.radius }, { p.radius = it }),
                 seek("Размер текста", 24, { p.textSize }, { p.textSize = it })))

             col.addView(label("АНИМАЦИЯ"))
             col.addView(card(seek("Длительность (мс)", 1000, { p.animMs }, { p.animMs = it })))

             col.addView(label("ИНТЕРФЕЙС ПРИЛОЖЕНИЯ"))
             col.addView(card(sw("Размытие фона (как в One UI)", { p.blurApp }, { p.blurApp = it; recreate() })))

             setContentView(ScrollView(this).apply { overScrollMode = View.OVER_SCROLL_NEVER; addView(col) })
             requestPermissions(arrayOf(android.Manifest.permission.READ_PHONE_STATE, android.Manifest.permission.ANSWER_PHONE_CALLS, android.Manifest.permission.POST_NOTIFICATIONS), 1)
         }

         private fun reload() { startForegroundService(Intent(this, IslandService::class.java).setAction("reload")) }
         private fun test(s: String) { startForegroundService(Intent(this, IslandService::class.java).setAction("test").putExtra("s", s)) }

         private fun label(t: String) = TextView(this).apply {
             text = t; textSize = 13f; setTextColor(Color.parseColor("#6B7280")); typeface = Typeface.DEFAULT_BOLD; setPadding(dp(10), dp(18), 0, dp(8))
         }

         private fun card(vararg v: View) = LinearLayout(this).apply {
             orientation = LinearLayout.VERTICAL
             background = GradientDrawable().apply { setColor(Color.parseColor("#B8FFFFFF")); cornerRadius = dp(26).toFloat() }
             setPadding(dp(18), dp(8), dp(18), dp(8))
             layoutParams = LinearLayout.LayoutParams(-1, -2)
             v.forEach { addView(it) }
         }

         private fun pillBtn(t: String, f: () -> Unit) = TextView(this).apply {
             text = t; gravity = Gravity.CENTER; textSize = 15f; setTextColor(accent); typeface = Typeface.DEFAULT_BOLD
             background = GradientDrawable().apply { setColor(Color.parseColor("#1F0381FE")); cornerRadius = dp(22).toFloat() }
             setPadding(dp(14), dp(12), dp(14), dp(12))
             layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(6); bottomMargin = dp(6) }
             setOnClickListener { f() }
         }

         private fun testRow(vararg pairs: Pair<String, String>) = LinearLayout(this).apply {
             orientation = LinearLayout.HORIZONTAL
             pairs.forEach { (n, st) ->
                 addView(pillBtn(n) { test(st) }.apply { layoutParams = LinearLayout.LayoutParams(0, -2, 1f).apply { setMargins(dp(3), dp(6), dp(3), dp(6)) } })
             }
         }

         private fun sw(t: String, g: () -> Boolean, st: (Boolean) -> Unit, after: (() -> Unit)? = null) = Switch(this).apply {
             text = t; textSize = 16f; setTextColor(Color.parseColor("#111111")); isChecked = g(); setPadding(0, dp(10), 0, dp(10))
             val states = arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf())
             thumbTintList = ColorStateList(states, intArrayOf(Color.WHITE, Color.WHITE))
             trackTintList = ColorStateList(states, intArrayOf(accent, Color.parseColor("#C8CCD6")))
             setOnCheckedChangeListener { _, v -> st(v); if (after != null) after() else reload() }
         }

         private fun seek(t: String, mx: Int, g: () -> Int, st: (Int) -> Unit, shift: Int = 0): View {
             val l = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(0, dp(8), 0, dp(4)) }
             val tv = TextView(this).apply { text = "$t: ${g() - shift}"; textSize = 15f; setTextColor(Color.parseColor("#111111")) }
             val sb = SeekBar(this).apply {
                 max = mx; progress = g()
                 progressTintList = ColorStateList.valueOf(accent); thumbTintList = ColorStateList.valueOf(accent)
                 setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                     override fun onProgressChanged(b: SeekBar, v: Int, u: Boolean) { st(v); tv.text = "$t: ${v - shift}" }
                     override fun onStartTrackingTouch(b: SeekBar) {}
                     override fun onStopTrackingTouch(b: SeekBar) { reload() }
                 })
             }
             l.addView(tv); l.addView(sb); return l
         }

         private fun field(hint: String, g: () -> String, st: (String) -> Unit) = EditText(this).apply {
             setText(g()); this.hint = hint; textSize = 16f; setSingleLine()
             background = GradientDrawable().apply { setColor(Color.parseColor("#14000000")); cornerRadius = dp(14).toFloat() }
             setPadding(dp(14), dp(10), dp(14), dp(10))
             layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(6); bottomMargin = dp(6) }
             addTextChangedListener(object : TextWatcher {
                 override fun afterTextChanged(e: Editable?) { st(e?.toString() ?: "") }
                 override fun beforeTextChanged(a: CharSequence?, b: Int, c: Int, d: Int) {}
                 override fun onTextChanged(a: CharSequence?, b: Int, c: Int, d: Int) {}
             })
             setOnFocusChangeListener { _, f -> if (!f) reload() }
         }
     }
     EOF_FILE
     mkdir -p $(dirname app/src/main/res/drawable/ic_launcher.xml)
     cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF_FILE'
     <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48">
     <path android:fillColor="#000000" android:pathData="M4,16h40a8,8 0 0,1 0,16h-40a8,8 0 0,1 0,-16z"/></vector>
     EOF_FILE
     mkdir -p $(dirname app/src/main/res/values/styles.xml)
     cat > app/src/main/res/values/styles.xml <<'EOF_FILE'
     <resources>
         <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar"/>
         <style name="SettingsTheme" parent="android:Theme.Material.Light.NoActionBar">
             <item name="android:windowIsTranslucent">true</item>
             <item name="android:windowShowWallpaper">true</item>
             <item name="android:statusBarColor">@android:color/transparent</item>
             <item name="android:navigationBarColor">@android:color/transparent</item>
         </style>
     </resources>
     EOF_FILE
     mkdir -p $(dirname build.gradle)
     cat > build.gradle <<'EOF_FILE'
     plugins {
         id 'com.android.application' version '8.5.2' apply false
         id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
     }
     EOF_FILE
     mkdir -p $(dirname gradle.properties)
     cat > gradle.properties <<'EOF_FILE'
     org.gradle.jvmargs=-Xmx2g
     android.useAndroidX=true
     EOF_FILE
     mkdir -p $(dirname module/customize.sh)
     cat > module/customize.sh <<'EOF_FILE'
     #!/system/bin/sh
     SKIPUNZIP=0
     ui_print "- Dynamic Island: установка как системное приложение"
     set_perm_recursive $MODPATH/system/priv-app/DynamicIsland 0 0 0755 0644
     set_perm $MODPATH/system/etc/permissions/privapp-permissions-com.island.app.xml 0 0 0644
     ui_print "- Готово. Перезагрузите телефон, затем откройте приложение"
     ui_print "  и выдайте: Поверх окон + Доступ к уведомлениям."
     EOF_FILE
     mkdir -p $(dirname module/module.prop)
     cat > module/module.prop <<'EOF_FILE'
     id=dynamic_island
     name=Dynamic Island
     version=v1.0
     versionCode=1
     author=you
     description=Динамический остров: медиа, звонки (Ответить/Отклонить), фонарик, запись экрана.
     EOF_FILE
     mkdir -p $(dirname module/service.sh)
     cat > module/service.sh <<'EOF_FILE'
     #!/system/bin/sh
     until [ "$(getprop sys.boot_completed)" = "1" ]; do sleep 2; done
     sleep 5
     pm grant com.island.app android.permission.READ_PHONE_STATE
     pm grant com.island.app android.permission.ANSWER_PHONE_CALLS
     pm grant com.island.app android.permission.POST_NOTIFICATIONS
     appops set com.island.app SYSTEM_ALERT_WINDOW allow
     cmd notification allow_listener com.island.app/com.island.app.IslandNotifListener
     am start-foreground-service -n com.island.app/.IslandService
     EOF_FILE
     mkdir -p $(dirname module/system/etc/permissions/privapp-permissions-com.island.app.xml)
     cat > module/system/etc/permissions/privapp-permissions-com.island.app.xml <<'EOF_FILE'
     <?xml version="1.0" encoding="utf-8"?>
     <permissions>
         <privapp-permissions package="com.island.app">
             <permission name="android.permission.SYSTEM_ALERT_WINDOW"/>
             <permission name="android.permission.ANSWER_PHONE_CALLS"/>
             <permission name="android.permission.READ_PHONE_STATE"/>
         </privapp-permissions>
     </permissions>
     EOF_FILE
     mkdir -p $(dirname settings.gradle)
     cat > settings.gradle <<'EOF_FILE'
     pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
     dependencyResolutionManagement { repositories { google(); mavenCentral() } }
     rootProject.name = "DynamicIsland"
     include ':app'
     EOF_FILE
  - run: gradle :app:assembleRelease
  - run: |
     mkdir -p module/system/priv-app/DynamicIsland
     cp app/build/outputs/apk/release/app-release.apk module/system/priv-app/DynamicIsland/DynamicIsland.apk
     cd module && zip -r ../DynamicIsland-KernelSU.zip .
  - uses: actions/upload-artifact@v4
    with:
     name: result
     path: |
      DynamicIsland-KernelSU.zip
      app/build/outputs/apk/release/app-release.apk
